<section class="macro-wrapper">
  @if (title()) {
    <h2 class="macro-title">{{ title() }}</h2>
  }

  @if (userId()) {
    <p class="macro-meta">User ID: <strong>{{ userId() }}</strong></p>
  }

  <div class="macro-input-group">
    <div>oe</div>
    <label for="macro-text" class="macro-label">Text</label>
    <input
      id="macro-text"
      class="macro-input"
      type="text"
      [value]="text()"
      (input)="onTextInput($event)"
      placeholder="Type something…"
      autocomplete="off"
    />
  </div>

  <div class="macro-output">
    <p class="macro-output__raw">Value: <span>{{ text() }}</span></p>
    <p class="macro-output__upper">Uppercase: <span>{{ uppercaseText() }}</span></p>
  </div>
</section>
