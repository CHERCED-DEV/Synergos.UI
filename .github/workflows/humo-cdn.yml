name: Humo del CDN (a pedido)

# Issue #9 — nadie comprobaba el CDN después de desplegarlo.
#
# Cloudflare sale verde cuando sube los ficheros. Verde significa «se subieron»,
# NO «el CDN funciona». La diferencia ya mordió, el mismo día del estreno:
# Cloudflare servía los assets antes de invocar al Worker, así que la política
# de caché entera era letra muerta y NO había CORS — el CMS, que vive en otro
# origen, no habría podido ejecutar ni un bundle. Los 17 tests de política de
# caché estaban en verde; lo que fallaba era que nadie llamaba a la función.
#
# ─────────────────────────────────────────────────────────────────────────────
# ESTE WORKFLOW YA NO CORRE EN CADA PUSH, Y ÉSE ERA EL DEFECTO (issue #74)
#
# Corría en `push` a master y esperaba a que el CDN sirviera EL COMMIT de ese
# push, comparándolo contra el `meta.json` que escribe `publish.mjs`. Su
# cabecera afirmaba «Cloudflare despliega en cada push a master» — y ningún
# workflow de este repo publicaba. Medido el 2026-09-22: el CDN servía un build
# del 12 con un commit que no está en ninguna rama. El `--sha` no podía casar
# nunca; el job quemaba cinco minutos y salía rojo en cada push.
#
# El despliegue ya vive en el repo: `despliegue-cdn.yml` publica y CORRE ESTE
# MISMO HUMO al terminar, que es donde esperar un commit significa algo, porque
# acaba de publicarlo. Lo que queda acá es la otra mitad, la que siempre fue
# legítima: comprobar el CDN **tal como está** cuando uno sospecha algo, sin
# empujar ni publicar nada.
#
# Por eso `sha` es opcional y por defecto está VACÍO. Sin despliegue detrás no
# hay ninguna razón para que el CDN sirva HEAD, así que exigírselo era la misma
# afirmación equivocada con otro disparador — y habría hecho fallar también a
# quien lo corriera a mano para ver si el CDN está vivo.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL pública del CDN'
        required: false
        default: 'https://synergos-ui.synergos-labs.workers.dev'
      sha:
        description: 'Esperar a que el CDN sirva ESTE commit corto (vacío = comprobar lo que haya)'
        required: false
        default: ''

jobs:
  humo:
    name: El CDN responde como debe
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El humo NO necesita dependencias: usa fetch de Node y los módulos del
      # repo. Instalar aquí sólo añadiría una forma más de que falle por algo
      # que no es el CDN.
      - name: Humo contra la URL pública
        env:
          URL: ${{ github.event.inputs.url || 'https://synergos-ui.synergos-labs.workers.dev' }}
          SHA: ${{ github.event.inputs.sha }}
        run: |
          if [ -n "$SHA" ]; then
            echo "Esperando a que el CDN sirva $SHA…"
            node tools/humo-cdn.mjs "$URL" --sha "$SHA" --intentos 30
          else
            echo "Comprobando el CDN tal como está (sin esperar ningún commit)."
            node tools/humo-cdn.mjs "$URL"
          fi
