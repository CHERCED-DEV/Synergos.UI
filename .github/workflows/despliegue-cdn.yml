name: Despliegue del CDN

# Issue #74 — el humo esperaba un despliegue que nadie hacía.
#
# ─────────────────────────────────────────────────────────────────────────────
# LO QUE SE MIDIÓ, Y POR QUÉ ESTE FICHERO EXISTE
#
# `humo-cdn.yml` corría en cada push a master y esperaba —30 intentos, cinco
# minutos— a que el CDN sirviera EL COMMIT de ese push, comparándolo contra el
# `meta.json` que escribe `publish.mjs`. Su cabecera afirmaba «Cloudflare
# despliega en cada push a master».
#
# El disco decía otra cosa: NINGÚN workflow de este repo publicaba. Medido el
# 2026-09-22 —master con siete push desde el 12— el CDN seguía sirviendo un
# build del 2026-09-12 con el commit `b951c77`, que no está en master, ni en el
# respaldo anterior a la refirma, ni en ninguna rama. O sea: lo último que se
# publicó salió de un `wrangler deploy` a mano, desde un árbol de trabajo que
# nunca llegó a GitHub.
#
# Así que ese `--sha` NO PODÍA CASAR NUNCA. Cuatro corridas rojas seguidas, que
# es exactamente el umbral que este repo ya tiene escrito —un gate siempre rojo
# deja de leerse— y el rojo permanente era lo único que decía que el CDN llevaba
# diez días congelado. La señal existía y estaba apagada por gritar siempre.
#
# Medido también: el CDN en sí está SANO. `humo-cdn.mjs` sin `--sha` pasa sus
# siete comprobaciones —política de caché, CORS, 404, runtime—. Lo que fallaba
# no era el CDN: era el gate afirmando un mecanismo de despliegue inexistente.
#
# POR QUÉ EL DESPLIEGUE ENTRA AL REPO Y NO SE ARREGLA SÓLO EL DISPARADOR
#
# `wrangler.jsonc` afirma que `public/` «se genera en cada despliegue a partir
# de las fuentes, que es lo que hace que el contenido publicado y el repo no
# puedan divergir». Eso es falso hoy, y lo es porque el mecanismo que lo
# sostenía vive FUERA del repo: nadie de acá puede verlo, gatearlo ni
# diagnosticarlo. Mover el humo a `workflow_dispatch` y ya habría cambiado un
# rojo permanente por un gate que no corre nunca —el issue #68 tal cual— y
# habría callado la única señal de la divergencia.
#
# EL DÍA QUE APAREZCAN LAS CREDENCIALES, HAY QUE DESCONECTAR WORKERS BUILDS.
# Si la integración de Cloudflare sigue enganchada, tener dos publicadores sobre
# el mismo Worker es dos builds del mismo commit pisándose: no rompe nada, y
# deja sin saber cuál de los dos publicó lo que está arriba. Este workflow es el
# que lleva la puerta y el humo; el otro no lleva ninguno de los dos.
#
# SÓLO UN RELEASE SE PUBLICA (R-2 del CMS, D-002-P12, 2026-11-04)
#
# Hasta hoy cada push a master publicaba. El arquitecto pidió un único release
# con todo completo, y la CDN es parte de producción: se PUBLICA sólo con la
# etiqueta de un release —`release-AAAA-MM-DD`, la misma que el director pone a
# la vez en el CMS— o con el disparo manual de un release ya etiquetado (volver a
# uno bueno). Un push a master la sigue CONSTRUYENDO y COMPROBANDO —contratos y
# `build:cdn`, con o sin credenciales— y no publica. En un release, el commit
# tiene que estar en master y los contratos se cruzan con el CMS del MISMO
# release, no con su master del momento. Un gate (`cdn-sale-con-un-release`) se
# pone rojo si algo publica sin release.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Construir y comprobar, sin publicar.
  push:
    branches:
      - main
      - master
    # Publicar: la etiqueta del release.
    tags: ['release-*']

  # Volver a publicar un release que ya salió, sin inventar una etiqueta nueva.
  # Pide el NOMBRE del release, no un SHA: lo que llega a producción es siempre un release.
  workflow_dispatch:
    inputs:
      release:
        description: 'Etiqueta del release a publicar (p. ej. release-2026-11-20)'
        required: true

# NUNCA dos a la vez: dos `wrangler deploy` sobre el mismo Worker se pisan, y el
# que termine último gana sin que nada lo diga. Se encolan, no se cancelan — un
# despliegue a medias es peor que uno que espera.
concurrency:
  group: despliegue-cdn
  cancel-in-progress: false

jobs:
  desplegar:
    name: Publicar y comprobar que quedó servido
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 0. ¿Es un release, o sólo se comprueba? ──────────────────────────
      #
      # Un push a una rama no es un release: construye y comprueba, y nada más.
      - id: release
        name: ¿Es un release?
        env:
          RELEASE: ${{ github.event.inputs.release || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [ -z "$RELEASE" ]; then
            echo "publicar=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Push a master: se construye y se comprueba, no se publica"
              echo
              echo "La CDN de producción se publica sólo con la etiqueta de un release (R-2)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$RELEASE" in
            release-*) ;;
            *) echo "✗ «$RELEASE» no es una etiqueta de release (release-AAAA-MM-DD): la CDN sólo publica releases (R-2)."
               exit 1 ;;
          esac
          echo "publicar=si" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      # ── 0.bis ¿Hay a dónde publicar? ─────────────────────────────────────
      #
      # Mientras falten las credenciales esto NO se pone rojo en cada push: es
      # el defecto que este workflow viene a cerrar, y repetirlo acá sería
      # gracioso una vez. Se salta con un mensaje que dice qué falta, y se
      # enciende solo el día que existan. Es el mismo patrón que `deploy.yml`
      # del CMS, que espera a que alguien compre un VPS.
      - id: config
        if: steps.release.outputs.publicar == 'si'
        name: ¿Está configurado el destino?
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CUENTA" ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Sin credenciales de Cloudflare todavía"
              echo
              echo "Falta \`CLOUDFLARE_API_TOKEN\` o \`CLOUDFLARE_ACCOUNT_ID\` (secrets)."
              echo
              echo "Esto NO es un fallo: el despliegue se enciende solo cuando existan."
              echo "Mientras tanto el CDN se publica a mano con \`npm run release\`, y"
              echo "lo que hay arriba puede no ser lo que dice este repo."
              echo
              echo "Al añadirlas hay que **desconectar Workers Builds** si sigue enganchada:"
              echo "dos publicadores sobre el mismo Worker dejan sin saber cuál publicó."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout UI (este repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.release || github.sha }}
          path: Synergos.UI
          # Toda la historia sólo en un release: hace falta para saber si su commit está en master.
          fetch-depth: ${{ steps.release.outputs.publicar == 'si' && '0' || '1' }}

      - if: steps.release.outputs.publicar == 'si'
        name: Es un release, y su commit está en master
        working-directory: Synergos.UI
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$RELEASE" >/dev/null \
            || { echo "✗ no existe la etiqueta $RELEASE en el UI."; exit 1; }
          SHA="$(git rev-parse "refs/tags/$RELEASE^{commit}")"
          git fetch --no-tags --quiet origin master
          git merge-base --is-ancestor "$SHA" FETCH_HEAD \
            || { echo "✗ $RELEASE apunta a ${SHA:0:7}, que no está en master: un release sale de lo integrado."; exit 1; }
          echo "✓ $RELEASE → ${SHA:0:7}, en master"

      # `cms:validate` cruza el `element-registry.json` de acá contra los
      # DocTypes de allá, y **falla si no encuentra su entrada** — con razón: un
      # gate que no halla lo que compara no puede pasar en verde.
      #
      # Va en CARPETA HERMANA y no dentro del árbol de la UI. Meter un repo
      # entero dentro del otro es lo que tumbó seis gates de segregación en el
      # CMS (#90): las herramientas recorren directorios, y de pronto cada
      # fichero aparece dos veces.
      #
      # SIN `token:` A PROPÓSITO, igual que `design-gates-ui.yml` (#14):
      # `CHERCED-DEV/Synergos.CMS` es público y el `GITHUB_TOKEN` del job basta.
      # Un `secrets.X` sin configurar le llega a `checkout` como cadena vacía y
      # aborta con «Input required and not supplied: token».
      #
      # En un release, el CMS del MISMO release: los contratos se cruzan con lo que
      # va a correr en producción, no con el master del CMS del momento. Si el CMS
      # no tiene esa etiqueta, esto falla, y está bien: el release va en los dos.
      - name: Checkout CMS (hermano — la otra mitad del contrato)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Synergos.CMS
          ref: ${{ steps.release.outputs.release }}
          path: Synergos.CMS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # La raíz NO es un workspace de npm (#70): la lista de plataformas se
      # deriva del disco, no se escribe acá.
      - name: Dependencias
        working-directory: Synergos.UI
        run: npm run setup

      # ── 1. Los gates, antes de publicar ──────────────────────────────────
      #
      # Publicar primero y comprobar después deja el CDN sirviendo lo que el
      # gate iba a rechazar — y publicar NO se deshace solo. `build:cdn` ya
      # corre el presupuesto de tamaño por dentro; esto añade los contratos,
      # que son los que cruzan con el CMS: un registry que el CMS no puede
      # resolver deja el sitio sin hidratar y la página se ve igual de bien.
      - name: Contratos
        working-directory: Synergos.UI
        env:
          SYNERGOS_CMS_PATH: ${{ github.workspace }}/Synergos.CMS
        run: npm run contracts:validate

      # ── 2. Construir lo que se va a servir ───────────────────────────────
      #
      # `public/` NO está versionado: sale de las fuentes en cada despliegue, y
      # eso es lo único que impide que el repo y lo publicado divergan. El
      # `meta.json` de cada elemento lleva el commit — es lo que el humo espera.
      #
      # Y conserva las generaciones del runtime ya publicadas (ADR 0140, CMS#201):
      # el import map nombra cada fichero por su huella, y lo que el despliegue
      # anterior publicó lo sigue pidiendo quien aún tenga ese mapa. `build:cdn`
      # las baja del CDN vivo y verifica cada huella; sin la variable va al CDN
      # público por defecto. Se le pasa el MISMO origen que mira el humo, para
      # que un `SYNERGOS_CDN_URL` propio conserve de donde se publica.
      - name: Construir el CDN
        working-directory: Synergos.UI
        env:
          SYNERGOS_CDN_CONSERVAR_DESDE: ${{ vars.SYNERGOS_CDN_URL || 'https://synergos-ui.synergos-labs.workers.dev' }}
        run: npm run build:cdn

      # ── 3. Publicar: sólo un release, y sólo con credenciales ────────────
      - if: steps.release.outputs.publicar == 'si' && steps.config.outputs.listo == 'si'
        name: wrangler deploy
        working-directory: Synergos.UI
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # ── 4. El humo, contra la URL PÚBLICA ────────────────────────────────
      #
      # Desplegar sin comprobar es el issue #9: «verde» significa que se
      # subieron los ficheros, no que el CDN funcione. Y se espera al commit,
      # porque el borde de Cloudflare tarda en propagar y un humo inmediato le
      # pega a la versión anterior y la da por buena.
      #
      # Acá el `--sha` SÍ tiene sentido, y ésa es la diferencia con lo que hacía
      # `humo-cdn.yml`: este workflow acaba de publicar ese commit, así que
      # esperarlo es esperar algo que va a llegar.
      - if: steps.release.outputs.publicar == 'si' && steps.config.outputs.listo == 'si'
        name: Humo contra la URL pública
        working-directory: Synergos.UI
        env:
          URL: ${{ vars.SYNERGOS_CDN_URL || 'https://synergos-ui.synergos-labs.workers.dev' }}
        run: |
          SHA="$(git rev-parse --short HEAD)"
          echo "Esperando a que el CDN sirva $SHA…"
          node tools/humo-cdn.mjs "$URL" --sha "$SHA" --intentos 30
