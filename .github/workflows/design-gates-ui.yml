name: Design gates UI (token bridge parity + contraste por tema)

# Gate G-1 (UI side) — Ola 2 del roadmap maestro
# (refactor-docs/architecture/14-roadmap-maestro.md, repo CMS).
#
# Corre `sync:tokens:check` en cada PR/push que toque el bridge generado,
# el script generador, o los estilos shared. BLOQUEA el merge si el
# bridge `_tokens-bridge.scss` quedó STALE respecto a la fuente
# `syn-tokens.css` (que vive en el repo SIBLING Synergos.CMS).
#
# RUNNER (G-4): CONECTADO y funcionando. Esta nota decía lo contrario —
# «hoy NO hay runner CI conectado» — y era cierta cuando se escribió, pero
# dejó de serlo sin que nadie la corrigiera. El coste fue concreto: el
# workflow llevaba tres días en rojo por otra causa (issue #14) y este
# párrafo lo explicaba away, así que nadie miró.
#
# Un rojo permanente que un comentario justifica es la misma trampa del
# issue #7 en otra forma: entrena a no mirar los rojos.
#
# CROSS-REPO: el job hace checkout de ESTE repo (UI) + del CMS sibling y
# apunta `SYNERGOS_CMS_PATH` al CMS para que el check compare contra la
# fuente real. El CMS es público, así que el checkout no lleva `token:`.

# G-2 vigila CUALQUIER .scss/.css del repo, no sólo el bridge, así que los
# filtros de path tienen que ser igual de anchos. Con la lista vieja —acotada a
# `libs/shared/src/styles/**`— un cambio en `vitals/.../tokens/_brand.scss` NO
# disparaba el workflow: el derivado rancio podía entrar sin que nada corriera.
#
# G-9 (#76) entra acá porque necesita el CMS chequeado —los vectores de oro de la
# hipoteca viven en su `docs/contracts/`— y `tests-ui.yml` no lo chequea. Y por eso
# los filtros suman lo que G-9 LEE: la calculadora y el propio gate. Un gate que no se
# dispara en el cambio que lo necesita no falla, se SALTA, y en la lista de checks un
# «skipped» se lee igual que un «no aplica» (es el defecto #128 del repo hermano).
#
# `**/mortgage.calc.ts` y `**/*-api.client.ts` van con comodín a propósito: hoy sólo
# Angular implementa los verticales, y el día que otra plataforma traiga los suyos los
# gates los cruzan —recorren en vez de nombrar la ruta— así que el filtro no puede ser
# el que caduque.
#
# Y lo que NINGÚN filtro de acá puede cubrir es el otro lado: G-9 y G-10 leen el CMS
# —sus vectores y sus `[Route]`/`[HttpX]`— y un push a ESE repo no dispara esto. Queda
# dicho en vez de insinuar que el cruce se vigila en las dos direcciones: del lado del
# CMS lo cubren `HipotecaVectoresTests` (los mismos vectores) y, para las rutas, nada
# todavía — quitar un endpoint allá no pone rojo nada hasta que este workflow corra.
on:
  pull_request:
    paths:
      - '**/*.scss'
      - '**/*.css'
      - 'platforms/angular/tools/sync-tokens.mjs'
      - 'tools/audit-themes.mjs'
      - '**/mortgage.calc.ts'
      - 'tools/vectores-hipoteca.mjs'
      - 'tools/lib/vectores-hipoteca.mjs'
      - '**/eventos-comision.ts'
      - 'tools/vectores-comision.mjs'
      - 'tools/lib/vectores-comision.mjs'
      - 'vitals/core/src/formato/**'
      - 'tools/vectores-unidades-menores.mjs'
      - 'tools/lib/vectores-unidades-menores.mjs'
      - '**/*-api.client.ts'
      - 'tools/rutas-del-borde.mjs'
      - 'tools/lib/rutas-del-borde.mjs'
      - 'tools/avisos-de-los-flujos.mjs'
      - 'tools/lib/avisos-de-los-flujos.mjs'
      - 'vitals/core/src/flujos/avisos.ts'
      - 'tools/contrato-synhost.mjs'
      - 'tools/lib/contrato-synhost.mjs'
      - 'vitals/contracts/src/elementos-synhost.contract.ts'
      - 'tools/contrato-http*.mjs'
      - 'tools/lib/contrato-http*.mjs'
      - 'vitals/contracts/src/http/**'
      - '.github/workflows/design-gates-ui.yml'
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.scss'
      - '**/*.css'
      - 'platforms/angular/tools/sync-tokens.mjs'
      - 'tools/audit-themes.mjs'
      - '**/mortgage.calc.ts'
      - 'tools/vectores-hipoteca.mjs'
      - 'tools/lib/vectores-hipoteca.mjs'
      - '**/eventos-comision.ts'
      - 'tools/vectores-comision.mjs'
      - 'tools/lib/vectores-comision.mjs'
      - 'vitals/core/src/formato/**'
      - 'tools/vectores-unidades-menores.mjs'
      - 'tools/lib/vectores-unidades-menores.mjs'
      - '**/*-api.client.ts'
      - 'tools/rutas-del-borde.mjs'
      - 'tools/lib/rutas-del-borde.mjs'
      - 'tools/avisos-de-los-flujos.mjs'
      - 'tools/lib/avisos-de-los-flujos.mjs'
      - 'vitals/core/src/flujos/avisos.ts'
      - 'tools/contrato-synhost.mjs'
      - 'tools/lib/contrato-synhost.mjs'
      - 'vitals/contracts/src/elementos-synhost.contract.ts'
      - 'tools/contrato-http*.mjs'
      - 'tools/lib/contrato-http*.mjs'
      - 'vitals/contracts/src/http/**'
      - '.github/workflows/design-gates-ui.yml'

jobs:
  tokens-bridge-parity:
    name: G-1 + G-2 sync:tokens:check · G-5 contraste por tema · G-9 hipoteca · G-10 rutas del borde · G-11 contrato SynHost · G-12 comisión · G-13 unidades menores · G-14 contrato HTTP · G-15 avisos de los flujos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UI (este repo)
        uses: actions/checkout@v4
        with:
          path: Synergos.UI

      # El check necesita la FUENTE de tokens, que vive en el CMS sibling.
      #
      # SIN `token:` A PROPÓSITO (issue #14). Llevaba `secrets.CMS_REPO_READ_TOKEN`,
      # que nunca se configuró, así que `actions/checkout` recibía una cadena
      # vacía y abortaba con «Input required and not supplied: token» — en el
      # paso 2 de 5, o sea que G-1, G-2 y G-5 no llegaban a ejecutarse nunca.
      #
      # `CHERCED-DEV/Synergos.CMS` es PÚBLICO: el GITHUB_TOKEN por defecto del
      # job basta para clonarlo. El día que pase a privado, este paso volverá a
      # fallar — y ahí el fallo será legítimo y dirá la verdad.
      - name: Checkout CMS (sibling — fuente de tokens)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Synergos.CMS
          path: Synergos.CMS

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Token bridge parity (G-1)
        # SYNERGOS_CMS_PATH apunta al CMS checkouteado para que el check
        # use la fuente real en vez de la convención de sibling dirs.
        run: |
          SYNERGOS_CMS_PATH="$GITHUB_WORKSPACE/Synergos.CMS" \
            node Synergos.UI/platforms/angular/tools/sync-tokens.mjs --check

      # ── G-5 — contraste WCAG sobre las 8 rutas de render ──────────────────
      #
      # Corre DESPUÉS del check de paridad a propósito: si el bridge está stale,
      # el fallo que interesa arreglar primero es ese, y un rojo de contraste
      # encima solo añadiría ruido.
      #
      # Por qué existe este gate: el método anterior de vigilar el contraste era
      # la inspección visual, y produjo un doc rector en el que OCHO de nueve
      # filas estaban mal. El bloque `auto-dark` incluso llevaba escrito el aviso
      # "quien toque un token de superficie aquí tiene que espejarlo" — y el
      # propio cambio que lo rompió se lo saltó, dejando texto blanco sobre fondo
      # casi blanco (1.046:1) durante quién sabe cuánto. Un aviso en prosa no es
      # un gate.
      #
      # Mide 184 pares × 8 rutas: los 7 `data-theme` MÁS `prefers-color-scheme:
      # dark` sin `data-theme`. Esa octava es justo la que se escapa de cualquier
      # barrido que busque "los 7 temas", y es la que estaba rota.
      #
      # El script se autotestea antes de emitir cifras (negro/blanco DEBE dar
      # 21.0000) y aborta con código 2 si su propio arnés falla — un arnés roto
      # que igualmente imprime números da falsa confianza. Código 1 = hay fallos
      # de contraste reales.
      - name: Contraste por tema (G-5)
        run: |
          SYNERGOS_CMS_PATH="$GITHUB_WORKSPACE/Synergos.CMS"             node Synergos.UI/tools/audit-themes.mjs

      # ── G-9 — la calculadora de hipoteca contra los vectores del CMS ──────
      #
      # POR QUÉ EXISTE (#76 · CMS#167). `IMortgageCalculator` del CMS afirmaba en su
      # `<remarks>` que «el cálculo base es el mismo en cliente y servidor». Era FALSO
      # desde que existe el endpoint: las dos implementaciones son la misma fórmula con
      # la tasa a 100× de distancia —acá porcentaje, allá fracción— y nada las cruzaba.
      # Medido ejecutando las dos reales sobre 300.000.000 / 60.000.000 / 240 meses:
      # `POST /api/realty/mortgage` contestaba 240.000.000 al mes donde esta app pinta
      # 2.642.606,72. Factor 90,82.
      #
      # Una frase en prosa no lo iba a cambiar: la frase YA estaba escrita, en el sitio
      # más autorizado posible. Lo que hacía falta es que las dos lo EJECUTEN.
      #
      # Necesita `node_modules` para esbuild —compila la fuente de verdad en vez de
      # reimplementar la fórmula, que sería la tercera copia— y ésa es la única razón
      # por la que este job instala. Sin el CMS, el gate sale en ROJO y no se salta:
      # en la lista de checks un «no pude comprobar» se lee igual que un «no aplica».
      - name: Instalar (esbuild para G-9)
        working-directory: Synergos.UI
        run: npm ci --ignore-scripts

      - name: Vectores de oro de la hipoteca (G-9)
        working-directory: Synergos.UI
        env:
          SYNERGOS_CMS_PATH: ${{ github.workspace }}/Synergos.CMS
        run: node tools/vectores-hipoteca.mjs

      # ── G-12 — la comisión que el carrito muestra es la que se cobra (CMS#194) ──
      #
      # Tres implementaciones de la misma regla —el carrito de `eventos`, el motor en proceso
      # del CMS y el orquestador— contra los mismos vectores de oro, con la forma de G-9: se
      # compila la fuente de verdad y, sin el CMS, sale en ROJO. Del lado del CMS los corren
      # `NegocioDeEventosTests` y `ComisionDeServicioTests`.
      - name: Vectores de oro de la comisión (G-12)
        working-directory: Synergos.UI
        env:
          SYNERGOS_CMS_PATH: ${{ github.workspace }}/Synergos.CMS
        run: node tools/vectores-comision.mjs

      # ── G-13 — los importes se pintan en la unidad en que el servidor los emite (CMS#196) ──
      #
      # La tasa de un trámite y la facturación de salud salían en pesos con el nombre *Minor y la
      # UI dividía por 100: una tasa de 189.000 se pintaba $ 1.890. El CMS emite con
      # UnidadesMenores y la UI pinta con aMenores/desdeMenores (vitals/core/src/formato): la
      # forma de G-12, con la fuente de verdad compilada y, sin el CMS, en ROJO. Del lado del CMS
      # los corre UnidadesMenoresTests.
      - name: Vectores de oro de las unidades menores (G-13)
        working-directory: Synergos.UI
        env:
          SYNERGOS_CMS_PATH: ${{ github.workspace }}/Synergos.CMS
        run: node tools/vectores-unidades-menores.mjs

      # ── G-10 — las rutas que los clientes piden existen en el borde ────────
      #
      # POR QUÉ EXISTE (#77). G-6 cruza las CLAVES de la respuesta y G-7 los CUERPOS de
      # la petición, y los dos dan por hecho que la ruta EXISTE. Una que no existe no
      # tiene claves ni cuerpo que cruzar, así que cae justo en el hueco entre los dos —
      # y por ahí vivían dos escrituras que fabricaban el acuse: la consola del vendedor
      # decía «Publicación creada» con un `PUB-…` inventado contra `seller/product`, que
      # el CMS no declara, y pintaba un pedido en «Enviado» contra un `/advance` que
      # tampoco. Las dos fallaban el 100 % de las veces.
      #
      # Una ruta ausente NO es automáticamente un defecto —una lectura que degrada con su
      # cartel es legítima— así que el gate es un censo con su razón, vigilado en los dos
      # sentidos. Lo que el censo no admite es una escritura ausente que invente el acuse.
      - name: Rutas del borde (G-10)
        working-directory: Synergos.UI
        env:
          SYNERGOS_CMS_PATH: ${{ github.workspace }}/Synergos.CMS
        run: node tools/rutas-del-borde.mjs

      # ── G-15 — el enlace del aviso de un flujo trae el parámetro que lee su participante ──
      #
      # POR QUÉ EXISTE (ADR 0140 F4 · CMS#201). El CMS manda en el correo
      # `Synergos:Puerta:Flujos:{flujo}:Aviso:Ruta` (hoy `/eventos/?compra={id}`) y `<synergos-eventos>`
      # abre la compra leyendo `?compra=`. Eran dos literales que nadie cruzaba, y el validador de la
      # puerta acepta cualquier ruta del sitio: un `/?id={id}` arrancaba y el enlace abría la
      # cartelera sin decir nada. Esto cruza `vitals/core/src/flujos/avisos.ts` con el
      # `appsettings.json` del CMS en los dos sentidos. Lo que NO ve: los `appsettings.<Entorno>.json`
      # de un despliegue; y, como G-10, un cambio del lado del CMS no dispara este workflow (allá lo
      # fija `CoordinadorDelFlujoEnLasVistasTests`).
      - name: Avisos de los flujos (G-15)
        working-directory: Synergos.UI
        env:
          SYNERGOS_CMS_PATH: ${{ github.workspace }}/Synergos.CMS
        run: node tools/avisos-de-los-flujos.mjs

      # ── G-11 — el tipo TS de lo que viaja a cada elemento sale del record del CMS ──
      #
      # POR QUÉ EXISTE (ADR 0135 · CMS#173). Cada vista SynHost armaba a mano un diccionario
      # libre de claves y nada obligaba a que fueran las que lee el elemento: 43 colocables
      # tiraban al hidratar lo que el editor escribió (D1). Ahora un record C# declara lo que
      # viaja, el CMS lo proyecta a `docs/contracts/elementos-synhost.json` (con gate de su
      # lado) y de ahí sale `vitals/contracts/src/elementos-synhost.contract.ts`, contra el que
      # se tipan los sanitizadores. Esto comprueba que el .ts versionado es el que da el JSON
      # de HOY: si no, los sanitizadores compilarían contra un cable que ya no existe.
      #
      # Lo que NINGÚN filtro de acá cubre es el otro lado: un record que cambia en el CMS no
      # dispara este workflow. Allá lo cubre `ContratoSynHostTests` (el JSON al día), y acá
      # se pone rojo en el siguiente cambio que toque el contrato. Dicho, no insinuado.
      - name: Contrato SynHost (G-11)
        working-directory: Synergos.UI
        env:
          SYNERGOS_CMS_PATH: ${{ github.workspace }}/Synergos.CMS
        run: node tools/contrato-synhost.mjs --check

      # ── G-14 — los tipos del contrato HTTP de los orquestadores salen de su OpenAPI ──
      #
      # POR QUÉ EXISTE (ADR 0140, F2 · CMS#201). Desde la F2 cada pieza del backend publica su
      # documento OpenAPI en el CMS (`docs/contracts/openapi/`), generado desde el host real y con
      # suelo (`ContratoOpenApiTests` y `SueloDelContratoTests`). De los `Synergos.Bff.*` —el
      # contrato del flujo, no el de las capacidades— sale `vitals/contracts/src/http/`: interfaces
      # y un mapa de tipos por operationId. Esto comprueba que lo versionado es lo que da el
      # documento de HOY y que el documento se sabe traducir entero; lo que no, se rechaza en vez
      # de volverse `unknown`. Sin el CMS sale en ROJO, como G-11.
      #
      # Lo que esto NO vigila todavía: que alguien IMPORTE esos tipos. Hasta la F4 nadie lo hace
      # (regla 24, abierta con fecha), así que un renombre allá se regenera y compila acá en verde.
      # Y como en G-11, un cambio del documento en el CMS no dispara este workflow: se pone rojo
      # en el siguiente cambio que toque el contrato, o en `contracts:validate`.
      - name: Contrato HTTP de los orquestadores (G-14)
        working-directory: Synergos.UI
        env:
          SYNERGOS_CMS_PATH: ${{ github.workspace }}/Synergos.CMS
        run: node tools/contrato-http.mjs --check
