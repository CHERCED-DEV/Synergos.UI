name: Tests UI (gates de tools/lib + specs de la plataforma)

# Issue #1 — los specs vuelven a ser un gate.
#
# Durante la purga de Nx los 240 `*.spec.ts` quedaron en el árbol sin correr:
# el runner ERA el executor de Nx. Este workflow los devuelve al CI.
#
# Los specs se COMPILAN antes de correr (`tools/build-specs.mjs`), con el mismo
# ngtsc que publica los elementos. No es una preferencia de estilo: los signal
# inputs de Angular no existen en JIT, y este repo prohíbe `@Input()`. Un
# transpilador al vuelo hace que los tests corran y mientan. La explicación
# entera está en la cabecera de `platforms/angular/tools/build-specs.mjs`.
#
# Va en un fichero aparte de `design-gates-ui.yml` porque aquel filtra por
# `**/*.scss` — unos triggers pensados para el bridge de tokens, que dejarían
# fuera cualquier cambio de TypeScript.

on:
  pull_request:
    paths:
      - 'platforms/angular/**'
      - 'vitals/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/tests-ui.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'platforms/angular/**'
      - 'vitals/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/tests-ui.yml'

jobs:
  tests:
    name: npm test — tools + specs de Angular
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # La raíz NO es un workspace de npm: cada plataforma tiene su propio
      # package.json y su propio lock, así que un `npm ci` en la raíz las deja
      # vacías — lo destapó el primer build en un entorno limpio, no un test.
      #
      # Y la LISTA se deriva del disco, no se escribe acá. Esto decía
      # `npm ci` + `npm ci --prefix platforms/angular` a mano, y el día que #64
      # creó `platforms/preact` nadie volvió: desde entonces el job muere en su
      # `pretest`, que es el guarda que el #70 puso para exactamente esto. O sea
      # que la comprobación funcionaba y lo que estaba mal era el paso de al lado.
      #
      # Es la regla 31 —una dimensión de lo que se recorre resuelta a constante—
      # cometida en el fichero que #70 no tocó. `npm run setup` recorre
      # `frameworksConstruibles`, así que la tercera plataforma entra sola.
      - name: Dependencias
        run: npm run setup

      # Corre los CUATRO: los gates de tools/lib (política de caché, presupuesto
      # de tamaño, cuarentena), los de vitals/, los specs de Angular y los de
      # Preact. La cifra no se escribe acá —decía «los 240 specs» y son otros
      # desde que #63 bajó cuatro ficheros a vitals/—: una cuenta que nadie cruza
      # se desvía, y ésta ni siquiera se lee al correr.
      - name: npm test
        run: npm test
