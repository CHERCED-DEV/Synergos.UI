name: Tests UI (gates de tools/lib + specs de la plataforma)

# Issue #1 — los specs vuelven a ser un gate.
#
# Durante la purga de Nx los 240 `*.spec.ts` quedaron en el árbol sin correr:
# el runner ERA el executor de Nx. Este workflow los devuelve al CI.
#
# Los specs se COMPILAN antes de correr (`tools/build-specs.mjs`), con el mismo
# ngtsc que publica los elementos. No es una preferencia de estilo: los signal
# inputs de Angular no existen en JIT, y este repo prohíbe `@Input()`. Un
# transpilador al vuelo hace que los tests corran y mientan. La explicación
# entera está en la cabecera de `platforms/angular/tools/build-specs.mjs`.
#
# Va en un fichero aparte de `design-gates-ui.yml` porque aquel filtra por
# `**/*.scss` — unos triggers pensados para el bridge de tokens, que dejarían
# fuera cualquier cambio de TypeScript.

on:
  pull_request:
    paths:
      # TODAS las plataformas, no una lista con la de siempre. Faltaba
      # `platforms/preact/**` desde que #64 la creó, así que un cambio que
      # tocara SÓLO esa plataforma no disparaba ni un test — el #71 arregló el
      # paso de dependencias de este mismo fichero y no su filtro, que es la
      # otra mitad del mismo defecto (regla 25, #74).
      - 'platforms/**'
      - 'vitals/**'
      - 'tools/**'
      - 'package.json'
      # El fin de línea lo decide este fichero, y el job de Windows lo comprueba (#79).
      - '.gitattributes'
      - '.github/workflows/tests-ui.yml'
  push:
    branches:
      - main
      - master
    paths:
      # TODAS las plataformas, no una lista con la de siempre. Faltaba
      # `platforms/preact/**` desde que #64 la creó, así que un cambio que
      # tocara SÓLO esa plataforma no disparaba ni un test — el #71 arregló el
      # paso de dependencias de este mismo fichero y no su filtro, que es la
      # otra mitad del mismo defecto (regla 25, #74).
      - 'platforms/**'
      - 'vitals/**'
      - 'tools/**'
      - 'package.json'
      - '.gitattributes'
      - '.github/workflows/tests-ui.yml'

jobs:
  tests:
    name: npm test — tools + specs de Angular
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # La raíz NO es un workspace de npm: cada plataforma tiene su propio
      # package.json y su propio lock, así que un `npm ci` en la raíz las deja
      # vacías — lo destapó el primer build en un entorno limpio, no un test.
      #
      # Y la LISTA se deriva del disco, no se escribe acá. Esto decía
      # `npm ci` + `npm ci --prefix platforms/angular` a mano, y el día que #64
      # creó `platforms/preact` nadie volvió: desde entonces el job muere en su
      # `pretest`, que es el guarda que el #70 puso para exactamente esto. O sea
      # que la comprobación funcionaba y lo que estaba mal era el paso de al lado.
      #
      # Es la regla 31 —una dimensión de lo que se recorre resuelta a constante—
      # cometida en el fichero que #70 no tocó. `npm run setup` recorre
      # `frameworksConstruibles`, así que la tercera plataforma entra sola.
      - name: Dependencias
        run: npm run setup

      # Corre los CUATRO: los gates de tools/lib (política de caché, presupuesto
      # de tamaño, cuarentena), los de vitals/, los specs de Angular y los de
      # Preact. La cifra no se escribe acá —decía «los 240 specs» y son otros
      # desde que #63 bajó cuatro ficheros a vitals/—: una cuenta que nadie cruza
      # se desvía, y ésta ni siquiera se lee al correr.
      - name: npm test
        run: npm test

  # ───────────────────────────────────────────────────────────────────────────
  # Windows (#79). Hasta este job los cinco workflows corrían en `ubuntu-latest`,
  # y en Windows el camino de entrada no se podía recorrer: `npm run setup` daba
  # `spawnSync npm ENOENT` (npm es `npm.cmd`, y desde Node 20.12 un `.cmd` sólo
  # se lanza con `shell: true`), `gate:hipoteca` ejecutaba el shim POSIX de
  # `.bin/esbuild`, 4 specs esperaban rutas con `/`, y el checkout en CRLF hacía
  # mentir a `cms:sync:check` y al G-7 del CMS. Nada de eso lo ve un Linux: el
  # lanzador sin `shell` pasa ahí en verde.
  #
  # Corre lo que es barato y cubre el defecto: el fin de línea del checkout, el
  # `setup` desde cero (la prueba viva del lanzador) y los tramos que no
  # compilan Angular —contratos, `tools/lib` (donde `npm.spec.mjs` LANZA npm de
  # verdad) y `vitals`—. `test:angular` compila AOT 236 specs y ya corre en el
  # job de Linux; repetirlo acá costaría minutos sin cubrir nada del #79.
  #
  # La mutación que SÓLO se ve acá: que la decisión de `tools/lib/npm.mjs` sea
  # correcta y no llegue al proceso (un envoltorio que no aplica su `shell`). La
  # decisión pura la prueba cualquier sistema; la llamada, sólo éste: el paso de
  # dependencias y los tests de `npm.spec.mjs` que lanzan npm dan ENOENT.
  # ───────────────────────────────────────────────────────────────────────────
  windows:
    name: Windows — setup + contratos + tools + vitals
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El runner de Windows trae `core.autocrlf=true`: sin `.gitattributes` el
      # checkout sale en CRLF y nada se pone rojo por eso, sólo miente.
      - name: El checkout sale en LF (.gitattributes)
        shell: bash
        run: |
          crlf=$(git ls-files --eol | grep -c 'w/crlf' || true)
          if [ "$crlf" != "0" ]; then
            echo "::error::$crlf fichero(s) en CRLF en el disco: .gitattributes no aplica eol=lf (#79)"
            git ls-files --eol | grep 'w/crlf' | head -20
            exit 1
          fi
          echo "0 ficheros en CRLF"

      - name: Dependencias
        run: npm run setup

      # Por bash y con comillas: en PowerShell una coma en un argumento arma un
      # array, y `--solo` llegaría partido.
      - name: npm test (los tramos que no compilan Angular)
        shell: bash
        run: npm test -- "--solo=test:contratos,test:tools,test:vitals"
