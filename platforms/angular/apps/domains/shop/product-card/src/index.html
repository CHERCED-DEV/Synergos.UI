<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>synergos-product-card — Dev Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #f1f5f9;
        padding: 2rem;
        margin: 0;
      }
      h1 {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #94a3b8;
        margin: 0 0 1.5rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.5rem;
        max-width: 1200px;
      }
    </style>
  </head>
  <body>
    <h1>synergos-product-card · standalone preview</h1>
    <div class="grid">
      <synergos-product-card
        product-sku="SKU-001"
        layout="vertical"
        theme="light"
        variant="default"
      ></synergos-product-card>
      <synergos-product-card
        product-sku="SKU-002"
        layout="vertical"
        theme="dark"
        variant="default"
      ></synergos-product-card>
    </div>
  </body>
</html>
