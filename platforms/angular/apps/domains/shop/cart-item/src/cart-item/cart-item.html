@let item = item();

@if (item) {
  <div class="cart-item" [class]="'cart-item--' + theme()" role="group" [attr.aria-label]="item.name">
    <!-- Thumbnail -->
    @if (hasImage()) {
      <div class="cart-item__thumb">
        <img [src]="item.image" [alt]="item.name" loading="lazy" />
      </div>
    }

    <!-- Info -->
    <div class="cart-item__info">
      <p class="cart-item__name">{{ item.name }}</p>

      @if (item.variantId) {
        <p class="cart-item__variant">{{ item.variantId }}</p>
      }

      <p class="cart-item__price">{{ formatPrice(item.price, item.currency) }}</p>
    </div>

    <!-- Controls -->
    <div class="cart-item__controls">
      <span class="cart-item__qty-label" [id]="quantityLabelId">{{ qtyLabel() }}</span>
      <sg-quantity-selector
        [min]="1"
        [max]="99"
        [value]="item.quantity"
        [theme]="theme()"
        [ariaLabelledBy]="quantityLabelId"
        (quantityChange)="updateQty($event)"
      />

      <p class="cart-item__subtotal" aria-live="polite">
        {{ formatPrice(item.subtotal, item.currency) }}
      </p>

      <syn-icon-button
        class="cart-item__remove"
        icon="&times;"
        variant="danger"
        size="sm"
        [ariaLabel]="removeLabel() + ' ' + item.name"
        (pressed)="remove()"
      />
    </div>
  </div>
}
