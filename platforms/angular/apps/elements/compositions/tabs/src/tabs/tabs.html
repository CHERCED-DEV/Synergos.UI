@if (hasTabs()) {
  <div class="tabs">
    <div
      class="tabs__list"
      role="tablist"
      [attr.aria-orientation]="orientation()"
    >
      @for (tab of tabs(); track tab.id) {
        <button
          type="button"
          class="tabs__tab"
          role="tab"
          [id]="tab.tabId"
          [attr.data-tab-id]="tab.id"
          [class.tabs__tab--active]="isActive(tab)"
          [attr.aria-selected]="isActive(tab)"
          [attr.aria-controls]="tab.panelId"
          [attr.aria-disabled]="tab.disabled ? true : null"
          [disabled]="tab.disabled"
          [attr.tabindex]="tab.id === focusedId() ? 0 : -1"
          (click)="selectTab(tab)"
          (keydown)="onTabKeydown($event, tab)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    @for (tab of tabs(); track tab.id) {
      <div
        class="tabs__panel"
        role="tabpanel"
        [id]="tab.panelId"
        [attr.aria-labelledby]="tab.tabId"
        [hidden]="!isActive(tab)"
        [attr.tabindex]="isActive(tab) ? 0 : null"
      >
        {{ tab.content }}
      </div>
    }
  </div>
}
