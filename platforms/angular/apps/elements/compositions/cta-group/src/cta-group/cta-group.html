<div class="cta-group" [class]="hostClasses()">
  @if (hasPrimary()) {
    <a class="cta-group__link" [href]="primaryUrl()" rel="noopener noreferrer">
      <syn-button [label]="primaryLabel()" variant="solid" size="md" />
    </a>
  }
  @if (hasSecondary()) {
    <a class="cta-group__link" [href]="secondaryUrl()" rel="noopener noreferrer">
      <syn-button [label]="secondaryLabel()" variant="outline" size="md" />
    </a>
  }
</div>
