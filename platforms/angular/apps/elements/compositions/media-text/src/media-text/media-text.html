<div class="media-text" [class]="hostClasses()">
  @if (imageSrc()) {
    <div class="media-text__media">
      <img class="media-text__img" [src]="imageSrc()" [alt]="imageAlt()" loading="lazy" />
    </div>
  }
  <div class="media-text__content">
    @if (headingText()) {
      <syn-heading
        class="media-text__heading"
        [text]="headingText()"
        [tone]="headingTone()"
        level="h2"
        size="md"
      />
    }
    @if (body()) {
      <p class="media-text__body">{{ body() }}</p>
    }
    @if (hasCta()) {
      <a class="media-text__cta" [href]="ctaUrl()" rel="noopener noreferrer">
        <syn-button [label]="ctaLabel()" variant="solid" size="md" />
      </a>
    }
  </div>
</div>
