<div class="iframe-embed">
  @if (allowFullscreen()) {
    <iframe
      #frame
      class="iframe-embed__frame"
      [title]="title()"
      [loading]="loading()"
      [style.height]="height()"
      allowfullscreen
    ></iframe>
  } @else {
    <iframe
      #frame
      class="iframe-embed__frame"
      [title]="title()"
      [loading]="loading()"
      [style.height]="height()"
    ></iframe>
  }
</div>
