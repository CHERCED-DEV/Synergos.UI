<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>synergos-form-stepper — Dev Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { font-family: 'Inter', sans-serif; background: #f1f5f9; padding: 2rem; margin: 0; }
      h1 { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin: 0 0 1.5rem; }
    </style>

  <body>
    <h1>synergos-form-stepper · standalone preview</h1>
    <synergos-form-stepper
      stepsJson='[
        {"title":"Tus datos","description":"Cuéntanos quién asiste.","fields":[
          {"name":"name","label":"Nombre completo","type":"text","required":true,"placeholder":"Ada Lovelace"},
          {"name":"email","label":"Correo","type":"email","required":true,"placeholder":"ada@correo.com"}
        ]},
        {"title":"Preferencias","fields":[
          {"name":"track","label":"Pista de interés","type":"select","required":true,"options":[
            {"value":"design","label":"Diseño"},{"value":"eng","label":"Ingeniería"}
          ]},
          {"name":"notes","label":"Comentarios","type":"textarea","placeholder":"Opcional"}
        ]},
        {"title":"Confirmar","fields":[
          {"name":"terms","label":"Acepto los términos","type":"checkbox","required":true}
        ]}
      ]'
    ></synergos-form-stepper>
  </body>
