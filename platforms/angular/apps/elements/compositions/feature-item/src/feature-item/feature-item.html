<div class="feature-item" [class]="hostClasses()">
  @if (icon()) {
    <span class="feature-item__icon" aria-hidden="true">
      <img [src]="icon()" alt="" loading="lazy" />
    </span>
  }
  @if (headingText()) {
    <syn-heading
      class="feature-item__heading"
      [text]="headingText()"
      [tone]="headingTone()"
      level="h3"
      size="sm"
    />
  }
  @if (body()) {
    <p class="feature-item__body">{{ body() }}</p>
  }
</div>
