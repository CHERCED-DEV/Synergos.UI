<div class="qty" [class]="hostClasses()" role="group" aria-label="Quantity">
  <button
    class="qty__btn qty__btn--dec"
    type="button"
    [disabled]="!canDecrement()"
    [attr.aria-label]="'Decrease quantity'"
    (click)="decrement()"
  >
    <span aria-hidden="true">−</span>
  </button>

  <input
    class="qty__input"
    type="number"
    [min]="min()"
    [max]="max()"
    [step]="step()"
    [value]="quantity()"
    aria-label="Quantity"
    (change)="onInput($event)"
    (blur)="onInput($event)"
  />

  <button
    class="qty__btn qty__btn--inc"
    type="button"
    [disabled]="!canIncrement()"
    [attr.aria-label]="'Increase quantity'"
    (click)="increment()"
  >
    <span aria-hidden="true">+</span>
  </button>
</div>
