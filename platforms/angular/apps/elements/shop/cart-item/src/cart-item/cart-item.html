@let item = itemInput();

@if (item) {
  <div class="cart-item" [class]="'cart-item--' + theme()">
    <!-- Thumbnail -->
    @if (hasImage()) {
      <div class="cart-item__thumb">
        <img [src]="item.image" [alt]="item.name" loading="lazy" />
      </div>
    }

    <!-- Info -->
    <div class="cart-item__info">
      <p class="cart-item__name">{{ item.name }}</p>

      @if (item.variantId) {
        <p class="cart-item__variant">{{ item.variantId }}</p>
      }

      <p class="cart-item__price">{{ formatPrice(item.price, item.currency) }}</p>
    </div>

    <!-- Controls -->
    <div class="cart-item__controls">
      <sg-quantity-selector
        [min]="1"
        [max]="99"
        [value]="item.quantity"
        [theme]="theme()"
        (quantityChange)="updateQty($event)"
      />

      <p class="cart-item__subtotal">
        {{ formatPrice(item.subtotal, item.currency) }}
      </p>

      <button
        class="cart-item__remove"
        type="button"
        [attr.aria-label]="removeLabel() + ' ' + item.name"
        (click)="remove()"
      >
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 4h12M5 4V2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5V4M6 7v5M10 7v5M3 4l1 9.5a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5L13 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="sr-only">{{ removeLabel() }}</span>
      </button>
    </div>
  </div>
}
