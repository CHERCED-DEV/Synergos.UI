<section class="logo-cloud" [class]="hostClasses()">
  @if (headingText() || body()) {
    <header class="logo-cloud__header">
      @if (headingText()) {
        <syn-heading
          class="logo-cloud__heading"
          [text]="headingText()"
          [tone]="headingTone()"
          level="h2"
          size="md"
        />
      }

      @if (body()) {
        <div class="logo-cloud__body" [innerHTML]="body()"></div>
      }
    </header>
  }

  <syn-grid-columns
    [columns]="resolvedColumns()"
    [autoFit]="false"
    gap="md"
    minColumnWidth="10rem"
  >
    @for (item of parsedItems(); track trackItem(item, $index)) {
      <article class="logo-cloud__item">
        @if (item.href) {
          <syn-link
            class="logo-cloud__link"
            [href]="item.href"
            [target]="item.target || '_self'"
            [ariaLabel]="item.label || item.alt || 'Brand logo'"
            tone="neutral"
            [underline]="false"
          >
            <span class="logo-cloud__frame">
              <img
                class="logo-cloud__image"
                [src]="item.src"
                [alt]="item.alt || item.label || 'Brand logo'"
                loading="lazy"
              />

              @if (item.label) {
                <span class="logo-cloud__label">{{ item.label }}</span>
              }
            </span>
          </syn-link>
        } @else {
          <div class="logo-cloud__frame">
            <img
              class="logo-cloud__image"
              [src]="item.src"
              [alt]="item.alt || item.label || 'Brand logo'"
              loading="lazy"
            />

            @if (item.label) {
              <span class="logo-cloud__label">{{ item.label }}</span>
            }
          </div>
        }
      </article>
    }
  </syn-grid-columns>
</section>
