@if (hasTarget()) {
  <div class="countdown-digital" role="timer" [attr.aria-label]="ariaSummary()">
    @if (hasStarted()) {
      <p class="countdown-digital__started">{{ startedLabel() }}</p>
    } @else {
      <ol class="countdown-digital__units" aria-hidden="true">
        @for (unit of units(); track unit.key) {
          <li class="countdown-digital__unit">
            <span class="countdown-digital__cell">
              @for (cell of [unit.display]; track cell) {
                <span class="countdown-digital__digits">{{ cell }}</span>
              }
            </span>
            @if (showLabels()) {
              <span class="countdown-digital__label">{{ unit.label }}</span>
            }
          </li>
        }
      </ol>
      <p class="countdown-digital__sr">{{ ariaSummary() }}</p>
    }
  </div>
} @else {
  <p class="countdown-digital__invalid">{{ invalidLabel() }}</p>
}
<!-- El reloj se DESCRIBE (role=timer, que calla) y sólo se anuncia al cruzar un hito (#82). -->
<syn-live-region [message]="milestone()" />
