<section class="data-table" [attr.aria-label]="caption() || null">
  <syn-data-table
    class="data-table__table"
    [caption]="caption()"
    [columns]="parsedColumns()"
    [rows]="parsedRows()"
    [emptyLabel]="emptyLabel()"
    [striped]="striped()"
    [bordered]="bordered()"
    [hoverable]="hoverable()"
    [compact]="compact()"
  />
</section>
