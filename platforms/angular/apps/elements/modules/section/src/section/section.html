<section class="section" [class]="hostClasses()">
  @if (hasHeading()) {
    <div class="section__header">
      <syn-heading
        class="section__heading"
        [text]="headingText()"
        [level]="resolvedHeadingLevel()"
        [align]="headingAlign()"
        [tone]="headingTone()"
        size="lg"
      />
    </div>
  }

  <div class="section__body" [ngStyle]="containerStyles()">
    <ng-content />
  </div>
</section>
