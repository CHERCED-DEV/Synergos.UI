<section class="carousel" [attr.aria-label]="ariaLabel()">
  @if (hasTitle()) {
    <header class="carousel__header">
      <syn-heading [text]="title()" level="h2" size="md" class="carousel__heading" />
    </header>
  }

  @if (autoplayActive()) {
    <div class="carousel__controls">
      <syn-button
        class="carousel__autoplay-toggle"
        variant="ghost"
        size="sm"
        [label]="autoplayToggleLabel()"
        (click)="toggleAutoplay()"
      />
    </div>
  }

  <syn-carousel
    class="carousel__viewport"
    [items]="slides()"
    [loop]="loop()"
    [compact]="compact()"
    [startIndex]="activeIndex()"
    [ariaLabel]="ariaLabel()"
    [previousLabel]="previousLabel()"
    [nextLabel]="nextLabel()"
    [pagerLabel]="pagerLabel()"
    [slideLabel]="slideLabel()"
    (activeIndexChange)="onActiveIndexChange($event)"
  />
</section>
