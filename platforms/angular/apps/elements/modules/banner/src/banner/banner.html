<div class="banner" [class]="hostClasses()">
  <div class="banner__content">
    @if (title()) {
      <syn-heading
        class="banner__title"
        [text]="title()"
        [tone]="headingTone()"
        level="h3"
        size="sm"
      />
    }

    @if (body()) {
      <p class="banner__body">{{ body() }}</p>
    }
  </div>

  @if (hasCta()) {
    <a class="banner__cta-link" [href]="ctaUrl()" [target]="ctaTarget()" rel="noopener noreferrer">
      <syn-button [label]="ctaLabel()" variant="solid" size="md" />
    </a>
  }
</div>
