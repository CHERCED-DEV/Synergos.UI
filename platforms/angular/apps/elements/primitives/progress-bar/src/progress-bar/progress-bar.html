<div class="progress">
  @if (label() || (showValue() && !indeterminate())) {
    <div class="progress__caption">
      @if (label()) {
        <span class="progress__label">{{ label() }}</span>
      }
      @if (showValue() && !indeterminate()) {
        <span class="progress__value">{{ valueText() }}</span>
      }
    </div>
  }

  <div
    class="progress__track"
    role="progressbar"
    [class.progress__track--indeterminate]="indeterminate()"
    [attr.aria-label]="accessibleLabel()"
    [attr.aria-valuemin]="indeterminate() ? null : 0"
    [attr.aria-valuemax]="indeterminate() ? null : max()"
    [attr.aria-valuenow]="ariaValueNow()"
    [attr.aria-valuetext]="indeterminate() ? null : valueText()"
    [attr.aria-busy]="indeterminate() ? 'true' : null"
  >
    <div
      class="progress__fill"
      [class.progress__fill--indeterminate]="indeterminate()"
      [style.inline-size]="fillWidth()"
    ></div>
  </div>
</div>
