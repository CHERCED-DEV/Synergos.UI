@let cartItem = item();

@if (cartItem) {
  <div class="cart-item" [class]="'cart-item--' + theme()" role="group" [attr.aria-label]="cartItem.name">
    <!-- Thumbnail -->
    @if (hasImage()) {
      <div class="cart-item__thumb">
        <img [src]="cartItem.image" [alt]="cartItem.name" loading="lazy" />
      </div>
    }

    <!-- Info -->
    <div class="cart-item__info">
      <p class="cart-item__name">{{ cartItem.name }}</p>

      @if (cartItem.variantId) {
        <p class="cart-item__variant">{{ cartItem.variantId }}</p>
      }

      <p class="cart-item__price">{{ formatPrice(cartItem.price, cartItem.currency) }}</p>
    </div>

    <!-- Controls -->
    <div class="cart-item__controls">
      <span class="cart-item__qty-label" [id]="quantityLabelId">{{ qtyLabel() }}</span>
      <sg-quantity-selector
        [min]="1"
        [max]="99"
        [value]="cartItem.quantity"
        [theme]="theme()"
        [ariaLabelledBy]="quantityLabelId"
        (quantityChange)="updateQty($event)"
      />

      <p class="cart-item__subtotal" aria-live="polite">
        {{ formatPrice(cartItem.subtotal, cartItem.currency) }}
      </p>

      <syn-icon-button
        class="cart-item__remove"
        icon="&times;"
        variant="danger"
        size="sm"
        [ariaLabel]="removeLabel() + ' ' + cartItem.name"
        (pressed)="remove()"
      />
    </div>
  </div>
}
