<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synergos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <syn-root></syn-root>

    <!--
      ── Macro dev sandbox ────────────────────────────────────────────────────
      Simulates exactly how Umbraco consumes macros:
        1. Load the macro bundle (independent server, port 4201+)
        2. Drop the custom element anywhere in the DOM

      To test: run both servers in parallel
        nx serve shell             → localhost:4200  (this harness)
        nx serve macros-test-macro → localhost:4201  (the macro)
      ──────────────────────────────────────────────────────────────────────── -->
    <script src="http://localhost:4201/main.js" defer></script>
    <sg-test-macro user-id="123" title="Dev Sandbox"></sg-test-macro>
  </body>
</html>
