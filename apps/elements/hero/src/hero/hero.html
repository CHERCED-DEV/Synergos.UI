<section
  class="hero"
  [class]="hostClasses()"
  [style.background-image]="hasImage() ? 'url(' + imageSrc() + ')' : null"
>
  <div class="hero__content">
    @if (headingText()) {
      @switch (headingLevel()) {
        @case ('h1') { <h1 class="hero__heading">{{ headingText() }}</h1> }
        @case ('h2') { <h2 class="hero__heading">{{ headingText() }}</h2> }
        @case ('h3') { <h3 class="hero__heading">{{ headingText() }}</h3> }
        @default { <h1 class="hero__heading">{{ headingText() }}</h1> }
      }
    }

    @if (body()) {
      <p class="hero__body">{{ body() }}</p>
    }

    @if (hasCta()) {
      <a
        class="hero__cta"
        [href]="ctaUrl()"
        [target]="ctaTarget()"
        rel="noopener noreferrer"
      >
        {{ ctaLabel() }}
      </a>
    }
  </div>
</section>
